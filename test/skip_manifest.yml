# Which tests each CI leg expects to skip, enforced by
# test/support/skip_manifest.rb.
#
# This governs EVERY skip in the default suite, not only tz-capability ones —
# a new unconditional `skip` anywhere has to be declared under `always:`
# before a plain `bundle exec rake` passes. Four ways to fail: a skip nobody
# declared, a declared entry that passes instead of skipping, a conditional
# entry that skips while its capability is present, and a declared entry
# naming a test that no longer exists. So the coverage a leg gives up shows up
# in a diff rather than in a passing log, and the declarations can't rot.
#
# A leg is selected with DUCKLING_TZ_LEG; see .github/workflows/main.yml for
# how each is configured, and test/support/tz_capabilities.rb for the probes
# that decide whether a tz skip is legitimate.
#
# An entry is normally a bare test id: this leg always loses that test. An
# entry written as
#
#   - test: SomeTest#some_test
#     unless: capability_name
#
# loses it only where that capability is absent, and requires it to RUN where
# the capability is present. Use the conditional form only where the leg does
# not actually determine the capability — see CONDITIONAL_NOTE in
# test/support/skip_manifest.rb. Neither tz capability is determined by "host
# zoneinfo" alone: the backward-compat links depend on the image (two Ubuntu
# 24.04 systems disagree), and the modelling is rearguard on
# Debian/Ubuntu/macOS but vanguard on Alpine and FreeBSD, which ship tzdata
# that models negative DST. So both stay conditional; the one exception is
# linkless-zoneinfo's backward-compat entry, which is unconditional because
# bin/build-linkless-zoneinfo hard-fails if US/Eastern survives — a checked
# guarantee, not an assumption about the host.

# Leg-independent skips: known upstream limitations characterized by the tests
# themselves, unrelated to tz data.
always:
  - DucklingCommaListTest#test_bare_comma_separated_dates_collapse_into_one_entity
  - DucklingCommaListTest#test_naming_only_the_first_date_still_collapses_the_rest
  - DucklingCommaListTest#test_ambiguous_leading_date_format_is_not_reliably_the_resolved_value
  - DucklingParseTimeWeekdaysTest#test_next_monday_should_skip_to_the_following_monday
  - DucklingParseTimeWeekdaysTest#test_monday_after_next_should_skip_to_the_following_monday

# Leg 1 — current tzinfo-data. What a consumer who opts into the gem gets, and
# the configuration this repo developed against. Nothing is expected to be
# missing.
tzinfo-data: []

# Leg 2 — no tzinfo-data, host zoneinfo. What a consumer who does nothing gets
# on a stock Debian/Ubuntu box: rearguard modelling (no negative DST) and no
# backward-compat links, because those live in the tzdata-legacy package.
# Fixture/NegativeDst (test/duckling_tz_fixture_test.rb) covers the
# negative-DST behavior this loses; nothing restores US/Eastern, and v0.4.0
# deliberately does not try to.
system-zoneinfo:
  - test: DucklingTest#test_reference_zone_overlap_takes_first_occurrence_in_negative_dst_zones
    unless: negative_dst
  - test: DucklingTest#test_reference_zone_resolves_backward_compat_identifier
    unless: backward_compat_links

# Leg 3 — host zoneinfo with the backward-compat links stripped
# (bin/build-linkless-zoneinfo). The configuration the release notes are about:
# US/Eastern and ~100 other valid IANA names stop resolving.
#
# No runner is in this state on its own — ubuntu-latest resolves those names
# and so does macOS — so without this leg the headline behavior of v0.4.0 has
# no coverage anywhere, and the only assertions on the error message's remedy
# text never execute.
#
# The backward-compat entry is unconditional on purpose: the script hard-fails
# if US/Eastern survives the strip, so the leg *guarantees* the capability is
# absent — a checked guarantee, and `unless:` would let a silently broken
# strip go green again. The negative-DST entry is conditional instead: the
# script copies the host's modelling untouched (rearguard on
# Debian/Ubuntu/macOS, vanguard on Alpine/FreeBSD), so that capability is the
# host's fact, not the leg's.
linkless-zoneinfo:
  - test: DucklingTest#test_reference_zone_overlap_takes_first_occurrence_in_negative_dst_zones
    unless: negative_dst
  - DucklingTest#test_reference_zone_resolves_backward_compat_identifier

# Leg 4 — tzinfo-data pinned to 1.2022.7. A stale-but-present database, which
# is the harder failure mode: America/Nuuk resolves fine and answers with
# Greenland's pre-2023a rules, so the test fails on assertions rather than on
# lookup. Fixture/LateGap covers the gap-late-in-the-local-day edge this loses.
tzinfo-data-1.2022.7:
  - DucklingTest#test_reference_zone_resolves_gap_late_in_local_day

# Leg 5 — host zoneinfo, with America/Nuuk overwritten by its pre-2023a rules
# (bin/build-stale-zoneinfo). Both axes at once. The copied tree inherits the
# host's links state, so on a links-less host this is exactly an unpatched
# stock host, and on the CI runner (which has the links) it is that state
# plus US/Eastern — the conditional entry absorbs the difference.
stale-system-zoneinfo:
  - test: DucklingTest#test_reference_zone_overlap_takes_first_occurrence_in_negative_dst_zones
    unless: negative_dst
  - test: DucklingTest#test_reference_zone_resolves_backward_compat_identifier
    unless: backward_compat_links
  - DucklingTest#test_reference_zone_resolves_gap_late_in_local_day
