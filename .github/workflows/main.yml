name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  workflow_call:

permissions:
  contents: read

jobs:
  # Baseline: matches the Claude Code Web sandbox exactly (see #28). This is
  # the only entry required by branch protection on `main` (context
  # "Ruby 3.3.6") — keep this job's `name` unchanged, or update branch
  # protection's required check to match before renaming it. Split into its
  # own job (rather than folded into the informational matrix below) so the
  # `informational` job can `needs:` it and get skipped automatically by
  # GitHub Actions when this fails (see #98).
  baseline:
    runs-on: ubuntu-latest
    name: "Ruby 3.3.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Set up Rust
        # Pinned to match the Claude Code Web sandbox's pre-installed Rust
        # (see #28) so CI tests the same toolchain an agent can run there
        # without installing anything extra. Bump the pinned value here when
        # the sandbox image's Rust version changes (check via
        # `rustc --version` in a fresh Claude Code Web session).
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ext/duckling/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path ext/duckling/Cargo.toml -- -D warnings
      - name: Run the default task
        run: bundle exec rake

  # Two host environments no GitHub runner image provides, in containers:
  #
  # - Debian trixie + tzdata-legacy: vanguard tzdata (it models negative DST
  #   where rearguard-compiled data — Ubuntu, macOS — flattens it away) and,
  #   deliberately, the backward-compat links Debian split into tzdata-legacy.
  #   libclang-dev is for rb-sys's bindgen (GitHub's runner images ship
  #   libclang; this minimal image does not).
  # - Alpine: vanguard tzdata again, on musl. No precompiled gem targets musl
  #   (cross_targets.rb), so the source build this job runs is the path an
  #   Alpine consumer reaches only after forcing it (`gem install --platform
  #   ruby`, or `bundle config set force_ruby_platform true`). The *default*
  #   install picks the unversioned -linux gem — Gem::Platform matches it
  #   against a musl runtime — and fails at require on the missing glibc; see
  #   AGENTS.md's "musl consumers get the glibc build". This job does not
  #   reproduce that default either, since bundling a path-sourced gemspec
  #   compiles from source regardless. What it proves is narrower and worth
  #   stating as such: the source build succeeds on musl given the toolchain
  #   below, which is real coverage for the recovery path and for the recipe
  #   take.
  #
  # On the tz axis these jobs currently prove a negative, and that is the
  # point: both hosts carry tz data materially different from the ubuntu
  # runner's, and the suite is green regardless, because the gem depends on
  # tzinfo-data and tzinfo prefers it — the host's database never reaches the
  # suite. The matrix entries are named for that present-tense coverage — a
  # red leg means a toolchain/build break, not tz handling — and #118
  # renames them as it drops the dependency, points the suite at the host's
  # database in jobs like these, and adds the environment contracts that pin
  # what each state then means.
  #
  # Gating: not merge-blocking (branch protection requires only the
  # `baseline` context), but release-blocking — release.yml runs this
  # workflow as its `ci` reusable-workflow job, and `cross_gems`,
  # `benchmark`, and `publish` all `needs: ci`, and a reusable-workflow job
  # succeeds only if every job in the called workflow does. That is the
  # intended gate: don't cut a release the musl source build can't serve.
  # It does make these the only release-gating legs that hit external
  # package repositories at release time — every other job in the pipeline
  # uses preinstalled runner software or pinned actions — so the install
  # steps below are the flake surface, and `bundle install` retries.
  #
  # Container jobs, so the image's own Ruby runs and ruby/setup-ruby does not
  # apply (it has no musl support anyway); the toolchain comes from the
  # image's package manager, git included — which is why the install step
  # precedes checkout.
  tz-containers:
    needs: baseline
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "source build: Debian trixie + tzdata-legacy"
            image: ruby:3.4-trixie
            # trixie's rustc is frozen for the life of Debian 13 at 1.85.0 —
            # exactly the crate's edition-2024 floor, so this leg always runs
            # on the minimum compiler it will ever have, with no upgrade
            # path. ext/duckling/Cargo.toml records that floor as
            # `rust-version`, which converts a future >1.85 requirement into
            # a clean MSRV error from cargo instead of a confusing parse
            # error here while every other job stays green.
            setup: apt-get update -qq && apt-get install -y --no-install-recommends build-essential cargo rustc git tzdata tzdata-legacy libclang-dev
          # tzdata carries the zoneinfo (Alpine's ruby image ships none).
          # The clang22-* packages are for rb-sys's bindgen, which needs
          # libclang; and Alpine splits clang's resource headers
          # (stdckdint.h, which ruby-3.4's headers include) away from the
          # library's default search path, so bindgen is pointed at them
          # explicitly. Any musl consumer building the source gem needs the
          # same three things. #118 adds tzdata-utils (zic) for its
          # fixture-zone tests.
          #
          # The image is pinned by digest (consistent with the SHA-pinned
          # actions) because the floating `ruby:3.4-alpine` tag silently
          # rebases across Alpine releases, and Alpine drops older versioned
          # clang packages as it rolls — an unpinned tag landing on an
          # Alpine without clang22-* fails this leg at `apk add` with zero
          # changes in this repo. Bump by resolving the tag's current digest
          # (`docker buildx imagetools inspect ruby:3.4-alpine`) and
          # re-verifying the clang package names against the new release.
          - name: "source build: Alpine/musl"
            image: ruby:3.4-alpine@sha256:c5a5064d190055633011c03aa800170cc36945ff3afb5f6c915329f92d6f1e00 # ruby:3.4-alpine, 3.4.10-alpine3.24
            setup: |
              apk add --no-cache build-base cargo rust git tzdata clang22-libclang clang22-headers
              headers="$(find /usr/lib/llvm* -name stdckdint.h -print -quit)"
              # find exits 0 on no matches, so without this the job would
              # export `-I.` (dirname "" is ".") and fail minutes later inside
              # bindgen with the very error this variable prevents.
              [ -n "$headers" ] || { echo "clang resource headers not found; check the clang*-headers package and the /usr/lib/llvm* layout" >&2; exit 1; }
              echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(dirname "$headers")" >> "$GITHUB_ENV"

    steps:
      - name: Install system packages
        run: ${{ matrix.setup }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bundler-cache here (no ruby/setup-ruby in a container), so every
      # run re-downloads the full gem set; --retry keeps a transient
      # rubygems blip from failing a release-gating leg.
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Run the test suite
        run: bundle exec rake test

  # Forward-compat signals only — not required to merge (see issue #29).
  # `needs: baseline` means GitHub Actions automatically skips this job when
  # `baseline` fails, instead of always running all entries in parallel
  # regardless of the baseline's outcome (see #98).
  informational:
    needs: baseline
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forward-compat signal: newer Ruby ABI, same pinned Rust.
          - name: "Ruby 3.4 (informational)"
            ruby: '3.4'
            rust: '1.94.1'
          - name: "Ruby latest (informational)"
            ruby: 'ruby'
            rust: '1.94.1'
          # Forward-compat signal: newest stable rustc, same baseline Ruby.
          - name: "Rust latest (informational)"
            ruby: '3.3.6'
            rust: 'stable'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Set up Rust
        # `rust` is 1.94.1 for every entry except "Rust latest", pinned to
        # match the Claude Code Web sandbox's pre-installed Rust (see #28) so
        # CI tests the same toolchain an agent can run there without
        # installing anything extra. The "Rust latest" entry floats on
        # `stable` deliberately, as a forward-compat signal.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ext/duckling/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path ext/duckling/Cargo.toml -- -D warnings
      - name: Run the default task
        run: bundle exec rake
