name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  workflow_call:

permissions:
  contents: read

jobs:
  # Baseline: matches the Claude Code Web sandbox exactly (see #28). This is
  # the only entry required by branch protection on `main` (context
  # "Ruby 3.3.6") — keep this job's `name` unchanged, or update branch
  # protection's required check to match before renaming it. Split into its
  # own job (rather than folded into the informational matrix below) so the
  # `informational` job can `needs:` it and get skipped automatically by
  # GitHub Actions when this fails (see #98).
  #
  # Carries the two tz legs that must not regress unnoticed, because being the
  # required check is the only thing that makes a leg blocking:
  #
  # - "tzinfo-data", implicitly — with no DUCKLING_* variables set the Gemfile
  #   installs current tzinfo-data. What this repo develops against.
  # - "system-zoneinfo", as a second step — what every consumer who does not
  #   add `gem "tzinfo-data"` now gets, and so the configuration least
  #   affordable to break. It runs here rather than in the `timezones` matrix
  #   below purely so it gates a merge; it needs no Ruby or Rust setup of its
  #   own, only a re-resolve of the bundle.
  #
  #   Note this runner is not a stock Ubuntu as far as tz data goes: it
  #   resolves the backward-compat links (US/Eastern) even though
  #   tzdata-legacy is not in its package list, where a plain ubuntu:24.04
  #   container of an earlier tzdata point release does not. So this leg
  #   proves the zoneinfo fallback and rearguard modelling, and the manifest
  #   treats the links as a capability rather than as a fact about the leg.
  #
  # The remaining legs are diagnostics for databases no consumer is on by
  # default, and live in `timezones` where a red result informs rather than
  # blocks.
  baseline:
    runs-on: ubuntu-latest
    name: "Ruby 3.3.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Set up Rust
        # Pinned to match the Claude Code Web sandbox's pre-installed Rust
        # (see #28) so CI tests the same toolchain an agent can run there
        # without installing anything extra. Bump the pinned value here when
        # the sandbox image's Rust version changes (check via
        # `rustc --version` in a fresh Claude Code Web session).
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ext/duckling/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path ext/duckling/Cargo.toml -- -D warnings
      - name: Run the default task
        run: bundle exec rake
      # BUNDLE_LOCKFILE keeps this re-resolve out of the committed
      # Gemfile.lock. The checkout is disposable, but leaving it dirty would
      # make any later step that inspects the tree misleading, and the same
      # command is what a contributor runs locally.
      #
      # Deployment mode has to be turned back off. `bundler-cache: true`
      # above writes `deployment: true` into .bundle/config, and deployment
      # requires a committed lockfile — while this leg's lockfile is
      # generated here and gitignored by design. Resolving a different bundle
      # is the entire point of the step, so deployment is the wrong setting
      # for it specifically.
      #
      # It has to be unset in the *local config*, not overridden with
      # BUNDLE_DEPLOYMENT. Bundler resolves settings local-config-first and
      # environment-second (`Bundler::Settings#configs`), which is the
      # opposite of the usual convention: an env var cannot override anything
      # `bundle config --local` has written.
      - name: Run the suite against the host's zoneinfo (no tzinfo-data)
        env:
          DUCKLING_TZ_LEG: system-zoneinfo
          DUCKLING_TZINFO_DATA: none
          BUNDLE_LOCKFILE: Gemfile.system-zoneinfo.lock
        run: |
          bundle config unset --local deployment
          bundle config unset --local frozen
          bundle install --jobs 4
          bundle exec rake test
      # The configuration v0.4.0's release notes are actually about: a host
      # where the backward-compat names stop resolving. It has to be built,
      # because no runner is in that state — this one resolves US/Eastern from
      # its own tzdata, and so does macOS. Without this leg the headline
      # behavior has no coverage, and the only assertions on the error
      # message's remedy text never execute.
      #
      # Gates a merge for the same reason the step above does. Reuses that
      # step's bundle (same DUCKLING_TZINFO_DATA, same lockfile), so it costs
      # a directory copy and a suite run, not a re-resolve.
      - name: Run the suite with the backward-compat links removed
        env:
          DUCKLING_TZ_LEG: linkless-zoneinfo
          DUCKLING_TZINFO_DATA: none
          BUNDLE_LOCKFILE: Gemfile.system-zoneinfo.lock
        run: |
          bin/build-linkless-zoneinfo "$RUNNER_TEMP/linkless-zoneinfo"
          DUCKLING_ZONEINFO_DIR="$RUNNER_TEMP/linkless-zoneinfo" bundle exec rake test

  # The tz-database axis. This gem does not depend on tzinfo-data, so
  # reference_zone: resolves against whichever database tzinfo found, and the
  # candidates disagree on both modelling (negative DST, backward-compat
  # links) and vintage. A suite run against one of them cannot observe which
  # one it ran against, so each configuration gets its own leg.
  #
  # `baseline` above runs the two legs a consumer is actually on — current
  # tzinfo-data, and the host's zoneinfo — so that they gate a merge. These
  # two are stale databases: worth knowing about, but a red result here means
  # "this vintage answers differently", not "the gem is broken for anyone
  # today". Note they are *not* required checks, so a merge can proceed over
  # them; they do gate a release, since release.yml's `needs: ci` waits on
  # this whole workflow rather than on the required check alone.
  #
  # Every leg declares in test/skip_manifest.yml exactly which tests it
  # expects to skip, and the run fails if a test skips undeclared, if a
  # declared one runs to completion, or if a declared entry names no existing
  # test — so what a leg costs in coverage shows up in a diff rather than in a
  # passing log.
  #
  # bundler-cache is off deliberately: these legs resolve a different bundle
  # than the committed lockfile, and the cache is keyed on that lockfile.
  # BUNDLE_LOCKFILE keeps that resolution out of the committed file.
  timezones:
    needs: baseline
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A stale-but-present database. Chosen over an older vintage that
          # lacks America/Nuuk entirely, because this one resolves the zone
          # and answers with Greenland's pre-2023a rules — a wrong answer is
          # harder to attribute than a missing identifier.
          - name: "tz: tzinfo-data 1.2022.7"
            leg: tzinfo-data-1.2022.7
            tzinfo_data: 1.2022.7
          # Both axes at once: host zoneinfo with America/Nuuk rolled back to
          # its pre-2023a rules — rearguard modelling and a stale vintage
          # together, which neither of the legs above reaches. The copied
          # tree inherits the runner's links state (it has them), so this is
          # an unpatched stock host plus US/Eastern; on a links-less host the
          # same build reproduces one exactly. The manifest's conditional
          # backward_compat_links entry absorbs the difference.
          - name: "tz: stale system zoneinfo"
            leg: stale-system-zoneinfo
            tzinfo_data: none
            build_stale_zoneinfo: true

    env:
      DUCKLING_TZ_LEG: ${{ matrix.leg }}
      DUCKLING_TZINFO_DATA: ${{ matrix.tzinfo_data }}
      BUNDLE_LOCKFILE: Gemfile.${{ matrix.leg }}.lock

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          toolchain: '1.94.1'
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Build the stale zoneinfo directory
        if: matrix.build_stale_zoneinfo
        run: |
          bin/build-stale-zoneinfo "$RUNNER_TEMP/stale-zoneinfo"
          echo "DUCKLING_ZONEINFO_DIR=$RUNNER_TEMP/stale-zoneinfo" >> "$GITHUB_ENV"
      - name: Run the test suite
        run: bundle exec rake test

  # Forward-compat signals only — not required to merge (see issue #29).
  # `needs: baseline` means GitHub Actions automatically skips this job when
  # `baseline` fails, instead of always running all entries in parallel
  # regardless of the baseline's outcome (see #98).
  informational:
    needs: baseline
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forward-compat signal: newer Ruby ABI, same pinned Rust.
          - name: "Ruby 3.4 (informational)"
            ruby: '3.4'
            rust: '1.94.1'
          - name: "Ruby latest (informational)"
            ruby: 'ruby'
            rust: '1.94.1'
          # Forward-compat signal: newest stable rustc, same baseline Ruby.
          - name: "Rust latest (informational)"
            ruby: '3.3.6'
            rust: 'stable'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Set up Rust
        # `rust` is 1.94.1 for every entry except "Rust latest", pinned to
        # match the Claude Code Web sandbox's pre-installed Rust (see #28) so
        # CI tests the same toolchain an agent can run there without
        # installing anything extra. The "Rust latest" entry floats on
        # `stable` deliberately, as a forward-compat signal.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable as of 2026-06-30
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ext/duckling/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path ext/duckling/Cargo.toml -- -D warnings
      - name: Run the default task
        run: bundle exec rake
