name: cross-gem

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross_gems:
    name: Cross-compile native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, x86_64-darwin, arm64-darwin, aarch64-linux]
        # Architecture `file(1)` must report for that platform's compiled
        # binary. A cross-compile that silently targets the build host
        # still exits 0 and still produces a correctly *named* artifact,
        # so the platform name alone proves nothing.
        include:
          - platform: x86_64-linux
            expected_arch: x86-64
          - platform: x86_64-darwin
            expected_arch: x86_64
          - platform: arm64-darwin
            expected_arch: arm64
          - platform: aarch64-linux
            expected_arch: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Cross-compile native gem
        uses: oxidize-rb/actions/cross-gem@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1.4.4
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          # One binary per Ruby ABI. rb-sys reads Ruby's internal object layout
          # through the headers it compiles against, so a binary understands
          # only the Ruby that built it. Load the wrong one and it misreads
          # objects: magnus rejects a genuine Time as not a Time.
          #
          # This list must agree with three others: CROSS_RUBY_ABIS in the
          # Rakefile, EXPECTED_ABIS below, and the smoke job's `ruby` matrix.
          #
          # The rbsys/<platform> images carry the toolchains for these ABIs.
          # Check /usr/local/rake-compiler/config.yml in the image before
          # adding one. A Ruby newer than every ABI here takes the source gem
          # instead, which compiles its own binary.
          ruby-versions: "3.2,3.3,3.4,4.0"

      - name: Verify gem metadata and architecture
        env:
          BUILT_GEM: ${{ steps.cross-gem.outputs.gem-path }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_ABIS: "3.2,3.3,3.4,4.0"
        run: ruby .github/scripts/verify-gem.rb

      - name: Upload native gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  # Installs each gem on real hardware and calls it.
  #
  # The job above reads gem files. It never loads one. A gem can hold a
  # correctly named binary, for the right architecture, and still fail on the
  # first call — an ABI mismatch is invisible until a Ruby object crosses into
  # Rust. These runners are also the only place the darwin and aarch64 gems run
  # at all, since the cross-compile containers cannot execute what they build.
  smoke:
    name: Smoke-test ${{ matrix.platform }} on Ruby ${{ matrix.ruby }}
    needs: cross_gems
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Must agree with `ruby-versions` and `EXPECTED_ABIS` above, and with
        # CROSS_RUBY_ABIS in the Rakefile. A Ruby missing here ships an ABI
        # that nothing tests. A Ruby here that is not built fails loudly.
        ruby: ['3.2', '3.3', '3.4', '4.0']
        platform: [x86_64-linux, x86_64-darwin, arm64-darwin, aarch64-linux]
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          # Intel macOS. This label must name a live runner image: GitHub does
          # not fail a job that asks for a retired one, it leaves the job
          # queued forever, so the run never reports at all.
          #
          # GitHub drops x86_64 macOS entirely once macos-15 retires,
          # announced for fall 2027. Move to macos-26-intel before then. Once
          # no runner can execute an x86_64-darwin gem, reconsider shipping
          # one.
          - platform: x86_64-darwin
            runner: macos-15-intel
          - platform: arm64-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Download native gem
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg

      - name: Install and exercise the gem
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # `gem install <file>` installs that file, and only this platform's
          # gem file is on disk, so nothing here can quietly fall back to the
          # source gem. An absent Rust toolchain would not prove that: these
          # runner images ship one, so a source-gem fallback would compile and
          # pass. What states which gem this run means to test is the
          # EXPECTED_PLATFORM check in smoke-gem.rb.
          gem install --no-document pkg/duckling-*-${{ matrix.platform }}.gem
          ruby .github/scripts/smoke-gem.rb
