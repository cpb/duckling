name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/main.yml

  cross_gems:
    name: Cross-compile native gems
    needs: ci
    uses: ./.github/workflows/cross-gem.yml

  benchmark:
    name: Record GitHub Actions benchmark results and open a PR
    needs: ci
    uses: ./.github/workflows/benchmark.yml
    # Reusable-workflow calls receive none of the caller's secrets by
    # default. Without this, benchmark.yml's RELEASE_AUTOMATION_PAT
    # expression falls back to GITHUB_TOKEN and its PR lands as
    # github-actions[bot] — whose CI runs sit at action_required awaiting
    # maintainer approval, stalling auto-merge (the 0.4.4 benchmark PR,
    # #146, even though the secret itself was set).
    secrets: inherit

  publish:
    name: Publish to RubyGems and GitHub Packages and create release
    needs: [ci, cross_gems]
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one. It must restate
    # contents and pull-requests, which the release and CHANGELOG steps need,
    # plus packages for the GitHub Packages push and id-token for the
    # RubyGems trusted-publishing exchange.
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      # The PAT credentials the CHANGELOG step's `git push` (via the
      # credential checkout persists here). It must not be GITHUB_TOKEN in
      # the end state: events caused by GITHUB_TOKEN don't trigger workflows,
      # so the changelog PR would never get CI and auto-merge would stall
      # BLOCKED. Without the secret, the fallback preserves that old behavior
      # rather than failing the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -e 'require "./lib/duckling/version"; puts Duckling::VERSION')"
          if [ "$tag_version" != "$gem_version" ]; then
            echo "Tag v$tag_version does not match Duckling::VERSION ($gem_version)" >&2
            exit 1
          fi

      - name: Download native gems
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-gem-*
          path: pkg
          merge-multiple: true

      - name: Build source gem
        run: |
          mkdir -p pkg
          gem build duckling.gemspec
          mv duckling-*.gem pkg/

      # Exchanges the GitHub OIDC token for a short-lived RubyGems token that
      # can only push this gem. It needs a trusted publisher registered on
      # RubyGems.org whose claims match this workflow file name exactly.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # GitHub Packages authenticates with the workflow's own GITHUB_TOKEN
      # (packages: write above) — no out-of-repo registration, unlike the
      # RubyGems push. This append must run after the step above:
      # configure-rubygems-credentials rewrites ~/.gem/credentials wholesale,
      # so a :github: key written before it would be lost. The leading
      # newline guards against the file lacking a trailing one, and gem push
      # refuses the file unless its mode is 0600.
      - name: Configure GitHub Packages credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '\n:github: Bearer %s\n' "${GITHUB_TOKEN}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials

      - name: Publish to RubyGems
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem"
          done

      # The same gems go to GitHub Packages' RubyGems registry (#107). This
      # runs after the RubyGems push on purpose: that push is the fragile one
      # (its trusted-publisher registration lives on RubyGems.org, outside
      # this repo), so a failure there leaves both registries untouched and
      # the tag safe to delete and re-push. If this step fails after RubyGems
      # succeeded, do not re-run the workflow — it would die on the RubyGems
      # duplicate-version check. Recover by fetching the published gems from
      # RubyGems (`gem fetch`) and pushing them here with the same flags.
      - name: Publish to GitHub Packages
        run: |
          # configure-rubygems-credentials exports GEM_HOST_API_KEY job-wide
          # holding the *RubyGems* token, and gem push checks that env var
          # before any --key selection (Gem::GemcutterUtilities#api_key) —
          # left set, this push sends the RubyGems token to GitHub Packages,
          # which 401s it. v0.4.4's publish failed exactly this way.
          unset GEM_HOST_API_KEY
          for gem in pkg/*.gem; do
            gem push --key github --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" "$gem"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            pkg/*.gem \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Update CHANGELOG.md
        env:
          # PAT, not GITHUB_TOKEN, so the PR this opens triggers CI — see
          # the checkout step above. Also covers this step's `gh release view`.
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_PAT || github.token }}
        run: |
          branch="changelog/${{ github.ref_name }}"
          git fetch origin main
          git checkout -b "$branch" origin/main

          version="${GITHUB_REF_NAME#v}"
          notes="$(gh release view "${{ github.ref_name }}" --json body -q .body)"

          VERSION="$version" NOTES="$notes" ruby -e '
            content = File.read("CHANGELOG.md")
            date = Time.now.strftime("%Y-%m-%d")
            entry = "## [#{ENV["VERSION"]}] - #{date}\n\n#{ENV["NOTES"]}\n\n"
            updated = content.sub("## [Unreleased]\n", "## [Unreleased]\n\n#{entry}")
            File.write("CHANGELOG.md", updated)
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for ${{ github.ref_name }}"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "Update CHANGELOG for ${{ github.ref_name }}" \
            --body "Automated changelog entry for ${{ github.ref_name }}."
          gh pr merge "$branch" --auto --squash
